# Configuração mínima do Supabase CLI.
# Vincule ao seu projeto com:  supabase link --project-ref <ref-do-projeto>
project_id = "saasagenda"

[functions.admin-create-establishment]
verify_jwt = true

[functions.create-staff-user]
verify_jwt = true

[functions.admin-manage-user]
verify_jwt = true

# chamada pelo gatilho do banco (sem token); a função se autentica sozinha
[functions.push-notify]
verify_jwt = false
